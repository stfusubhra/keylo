<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C7F000"/>
      <stop offset="100%" stop-color="#7AE7C7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative grid lines -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.05">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  <!-- KeyLo logo mark (key shape) -->
  <g transform="translate(120, 160)">
    <circle cx="60" cy="90" r="50" fill="none" stroke="url(#accent)" stroke-width="8"/>
    <line x1="95" y1="55" x2="200" y2="0" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <path d="M165 35 L200 0 L235 35 L220 35 L220 65 L190 65 L190 50 L220 50" fill="url(#accent)" stroke="none"/>
  </g>
  <!-- Main text -->
  <text x="220" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-2">KeyLo</text>
  <text x="220" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#C7F000" letter-spacing="4">KOLKATA STUDENT RENTALS</text>
  <!-- Tagline -->
  <text x="220" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#a0a0a0">Find verified stays &amp; essentials near your campus.</text>
  <!-- Feature pills -->
  <g transform="translate(220, 370)">
    <rect width="180" height="44" rx="4" fill="#C7F000" opacity="0.15" stroke="#C7F000" stroke-width="1"/>
    <text x="16" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#C7F000">Verified Listings</text>
  </g>
  <g transform="translate(415, 370)">
    <rect width="180" height="44" rx="4" fill="#7C3AED" opacity="0.2" stroke="#7C3AED" stroke-width="1"/>
    <text x="16" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#7C3AED">Deposit Protected</text>
  </g>
  <g transform="translate(610, 370)">
    <rect width="160" height="44" rx="4" fill="#38D9F5" opacity="0.15" stroke="#38D9F5" stroke-width="1"/>
    <text x="16" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#38D9F5">AI Inspected</text>
  </g>
  <g transform="translate(785, 370)">
    <rect width="180" height="44" rx="4" fill="#FF4F9A" opacity="0.15" stroke="#FF4F9A" stroke-width="1"/>
    <text x="16" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FF4F9A">Easy Disputes</text>
  </g>
  <!-- Bottom bar -->
  <rect x="0" y="560" width="1200" height="70" fill="#000000"/>
  <text x="600" y="602" font-family="system-ui, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="2">keylo-frontend.vercel.app</text>
</svg>
