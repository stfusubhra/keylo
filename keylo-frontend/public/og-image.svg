<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C7F000"/>
      <stop offset="100%" stop-color="#7AE7C7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative grid lines -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.05">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  <!-- KeyLo logo mark (house + key) -->
  <g transform="translate(120, 160)">
    <svg x="0" y="20" width="100" height="100" viewBox="0 0 40 40" fill="none">
      <path d="M2 2 H19 L5 15 Z" fill="#ffffff"/>
      <path d="M38 2 H21 L35 15 Z" fill="#ffffff"/>
      <path d="M15.8 25 A5.5 5.5 0 1 1 24.2 25" stroke="#C7F000" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="20" cy="28.5" r="2.8" stroke="#ffffff" stroke-width="2.2"/>
      <rect x="19.1" y="31.5" width="1.8" height="5" rx="0.9" fill="#ffffff"/>
      <rect x="20.9" y="33.8" width="2.4" height="1.6" rx="0.8" fill="#ffffff"/>
      <rect x="20.9" y="36.6" width="3.2" height="1.6" rx="0.8" fill="#ffffff"/>
    </svg>
  </g>
  <!-- Main text -->
  <text x="220" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-2">KeyLo</text>
  <text x="220" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#C7F000" letter-spacing="4">KOLKATA STUDENT RENTALS</text>
